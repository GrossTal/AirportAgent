services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: airport
      POSTGRES_PASSWORD: airport
      POSTGRES_DB: airport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airport -d airport"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
